# Builds the Windows live-wallpaper package: stars_helper.exe + the offline www bundle + config.json.
# See desktop/README.md.
name: Windows wallpaper

on:
  push:
    branches: [master]
    paths:
      - solar-system.html
      - img/**
      - scripts/**
      - desktop/**
      - package.json
      - package-lock.json
      - .github/workflows/windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build stars_helper.exe
        run: |
          python -m pip install pyinstaller==6.11.1
          pyinstaller --onefile --noconsole --name stars_helper desktop/stars_helper.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/stars_helper.exe out/
          Copy-Item -Recurse www out/www
          Copy-Item desktop/config.json, desktop/README.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: stars-wallpaper-windows
          path: out/
          if-no-files-found: error
