<title>Солнечная система</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: full-bleed canvas; name, date and facts top-left; body picker and time controls at the bottom */
  :root {
    --space: #020309;
    --ink: #e6ecff;
    --muted: rgba(190, 205, 240, 0.62);
    --chip: rgba(14, 18, 38, 0.9);
    --chip-line: rgba(140, 170, 255, 0.22);
    --chip-on: rgba(255, 190, 90, 0.2);
    --chip-on-line: rgba(255, 205, 130, 0.85);
    --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--space);
    color: var(--ink);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: var(--mono);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .head {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    max-width: 30rem;
    pointer-events: none;
    display: flex; flex-direction: column; gap: 5px;
    text-shadow: 0 0 8px var(--space);
  }
  .head h1 { margin: 0; font: 500 32px/1 var(--serif); text-wrap: balance; }
  .head p { margin: 0; font: 11px/1.55 var(--mono); letter-spacing: 0.06em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .head .note { font: italic 16px/1.35 var(--serif); letter-spacing: 0; color: var(--ink); max-width: 26rem; }
  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-block: 0 calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    pointer-events: none;
  }
  .hint {
    font: 10px/1.4 var(--mono); letter-spacing: 0.12em; color: var(--muted); text-align: center;
    text-shadow: 0 0 6px var(--space);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .row {
    display: flex; gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    pointer-events: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    touch-action: pan-x;
  }
  .row::-webkit-scrollbar { display: none; }
  .row > :first-child { margin-left: auto; }
  .row > :last-child { margin-right: auto; }
  .row button {
    flex: none;
    font: 12px/1 var(--mono); letter-spacing: 0.04em;
    color: var(--ink); background: var(--chip);
    border: 1px solid var(--chip-line); border-radius: 999px;
    padding: 9px 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .credit {
    font: 9px/1.4 var(--mono); letter-spacing: 0.04em; color: var(--muted); text-align: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: auto; text-shadow: 0 0 6px var(--space);
  }
  .credit a { color: inherit; }
  .row button[aria-pressed="true"] { background: var(--chip-on); border-color: var(--chip-on-line); }
  .row .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  button:focus-visible { outline: 2px solid var(--chip-on-line); outline-offset: 2px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=JetBrains+Mono:wght@400&display=swap">

<canvas id="sky"></canvas>

<div class="head">
  <h1 id="title">Солнечная система</h1>
  <p id="date">—</p>
  <p id="sub">Положения планет на эту дату · расстояния и размеры сжаты</p>
  <p class="note" id="note" hidden></p>
</div>

<div class="bottom">
  <div class="hint" id="hint">ВЫБЕРИ ПЛАНЕТУ ВНИЗУ ИЛИ НАЖМИ НА НЕЁ</div>
  <div class="row" id="bodies" role="toolbar" aria-label="Выбор объекта"></div>
  <div class="row" role="toolbar" aria-label="Скорость времени">
    <button id="s-0" data-speed="0" aria-pressed="false">Пауза</button>
    <button id="s-h" data-speed="0.0416667" aria-pressed="false">1 час/с</button>
    <button id="s-1" data-speed="1" aria-pressed="false">1 день/с</button>
    <button id="s-10" data-speed="10" aria-pressed="true">10 дней/с</button>
    <button id="s-100" data-speed="100" aria-pressed="false">100 дней/с</button>
    <button id="s-now" data-action="now">Сегодня</button>
    <button id="t-names" aria-pressed="true">Названия</button>
    <button id="t-small" aria-pressed="true">Астероиды и кометы</button>
    <button id="t-sky">Фон: скопление Девы</button>
  </div>
  <div class="credit">Фоны: скопление галактик Девы, туманности Лагуна и Трёхраздельная, глубокое звёздное поле, снимки <a href="https://rubinobservatory.org/gallery/media-policy" target="_blank" rel="noopener">NSF–DOE Vera C. Rubin Observatory/NOIRLab/SLAC/AURA</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></div>
</div>

<script>
(() => {
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2, DEG = Math.PI / 180;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
  const smooth = x => x * x * (3 - 2 * x);
  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

  // ---------- value noise for procedural surfaces ----------
  function hash(x, y, z) {
    let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const u = smooth(x - xi), v = smooth(y - yi), w = smooth(z - zi);
    const c = (dx, dy, dz) => hash(xi + dx, yi + dy, zi + dz);
    const x00 = lerp(c(0, 0, 0), c(1, 0, 0), u), x10 = lerp(c(0, 1, 0), c(1, 1, 0), u);
    const x01 = lerp(c(0, 0, 1), c(1, 0, 1), u), x11 = lerp(c(0, 1, 1), c(1, 1, 1), u);
    return lerp(lerp(x00, x10, v), lerp(x01, x11, v), w);
  }
  function fbm(x, y, z, oct = 4) {
    let s = 0, a = 0.5, f = 1, n = 0;
    for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, z * f); n += a; a *= 0.5; f *= 2.03; }
    return s / n;
  }

  // ---------- 3x3 matrices (row-major) ----------
  const mul = (A, B) => {
    const R = new Array(9);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++)
      R[r * 3 + c] = A[r * 3] * B[c] + A[r * 3 + 1] * B[3 + c] + A[r * 3 + 2] * B[6 + c];
    return R;
  };
  const rotY = a => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
  const rotX = a => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; };
  // camera: yaw about the vertical, then elevation `tilt` (π/2 = looking straight down). Output: screen x, screen y (down), depth (+ toward viewer)
  const camM = (yaw, tilt) => {
    const cy = Math.cos(yaw), sy = Math.sin(yaw), ct = Math.cos(tilt), st = Math.sin(tilt);
    return [cy, 0, -sy, sy * st, -ct, cy * st, sy * ct, st, cy * ct];
  };

  let W, H, DPR, zoom0, zoom, zoomTarget = 0, small;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    small = Math.min(W, H) < 600;
    const z = Math.min(W, H * 1.4) / 2 / 7.1;
    zoom = zoom0 ? zoom * z / zoom0 : z;
    zoomTarget = zoomTarget ? zoomTarget * z / zoom0 : z;
    zoom0 = z;
    resetStars();
  }
  const stars = [];
  const bgCanvas = document.createElement('canvas'), bgClose = document.createElement('canvas'), bgSun = document.createElement('canvas');
  let skyMode = 'cluster';
  // Rubin Observatory images (CC BY 4.0, credited on the page); procedural sky until they load
  const photos = { cluster: new Image(), spiral: new Image(), nebula: new Image(), field: new Image() };
  photos.field.src = 'img/rubin-star-field.jpg';
  photos.cluster.src = 'img/rubin-virgo-cluster.jpg';
  photos.spiral.src = 'img/rubin-virgo-spiral.jpg';
  photos.nebula.src = 'img/rubin-trifid-lagoon.jpg';
  for (const k in photos) photos[k].onload = () => resetStars();
  const ready = im => im.complete && im.naturalWidth > 0;
  // draws a photo to cover the screen around a focus point, darkened most where the planets sit
  function photoSky(c, im, fxp, fyp, dim) {
    c.width = W * DPR; c.height = H * DPR;
    const g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const k = Math.max(W / im.naturalWidth, H / im.naturalHeight), w = im.naturalWidth * k, h = im.naturalHeight * k;
    g.drawImage(im, clamp(W / 2 - fxp * w, W - w, 0), clamp(H / 2 - fyp * h, H - h, 0), w, h);
    const v = g.createRadialGradient(W / 2, H * 0.52, 0, W / 2, H * 0.52, Math.max(W, H) * 0.75);
    v.addColorStop(0, `rgba(2,3,9,${dim})`); v.addColorStop(1, `rgba(2,3,9,${dim * 0.45})`);
    g.fillStyle = v; g.fillRect(0, 0, W, H);
  }
  function resetStars() {
    stars.length = 0;
    for (let i = 0; i < W * H / 3500; i++) stars.push({ x: Math.random(), y: Math.random(), s: Math.random() < 0.15 ? 1.4 : 0.8, tw: rnd(0, TAU), sp: rnd(0.4, 1.5) });
    bgCanvas.width = W * DPR; bgCanvas.height = H * DPR;
    const g = bgCanvas.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.fillStyle = '#020309'; g.fillRect(0, 0, W, H);
    // a faint Milky Way band crossing the sky diagonally
    const ang = -0.95, ca = Math.cos(ang), sa = Math.sin(ang), L = Math.hypot(W, H);
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 60; i++) {
      const u = rnd(-0.5, 0.5) * L, v = gauss() * L * 0.06, x = W / 2 + u * ca - v * sa, y = H / 2 + u * sa + v * ca, r = rnd(30, 110);
      const cg = g.createRadialGradient(x, y, 0, x, y, r);
      cg.addColorStop(0, pick(['rgba(120,110,170,0.05)', 'rgba(90,120,190,0.05)', 'rgba(190,160,140,0.04)']));
      cg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = cg; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    }
    for (let i = 0; i < W * H / 120; i++) {
      const u = rnd(-0.5, 0.5) * L, v = gauss() * L * 0.05, x = W / 2 + u * ca - v * sa, y = H / 2 + u * sa + v * ca;
      g.fillStyle = `rgba(220,225,255,${rnd(0.03, 0.22).toFixed(2)})`;
      g.fillRect(x, y, 0.6, 0.6);
    }
    // two faint emission nebulae: pink hydrogen glow, a blue reflection lobe, dark dust lanes
    const nebula = (cx, cy, size) => {
      for (let i = 0; i < 140; i++) {
        const x = cx + gauss() * size, y = cy + gauss() * size * 0.8, r = rnd(0.08, 0.45) * size;
        const cg = g.createRadialGradient(x, y, 0, x, y, r);
        cg.addColorStop(0, pick(['rgba(255,70,130,0.06)', 'rgba(220,50,80,0.05)', 'rgba(255,130,160,0.045)', 'rgba(255,180,170,0.03)']));
        cg.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = cg; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
      }
      for (let i = 0; i < 18; i++) {
        const x = cx + size * 0.7 + gauss() * size * 0.35, y = cy - size * 0.5 + gauss() * size * 0.3, r = rnd(0.12, 0.35) * size;
        const cg = g.createRadialGradient(x, y, 0, x, y, r);
        cg.addColorStop(0, 'rgba(80,130,255,0.06)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = cg; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
      }
      g.globalCompositeOperation = 'source-over';
      for (let k = 0; k < 3; k++) {   // soft, curving dust lanes splitting the glow
        let a = rnd(0, TAU), x = cx + gauss() * size * 0.3, y = cy + gauss() * size * 0.3;
        const bend = rnd(-0.06, 0.06);
        for (let i = 0; i < 50; i++) {
          a += bend; x += Math.cos(a) * size * 0.025; y += Math.sin(a) * size * 0.025;
          const r = rnd(0.05, 0.11) * size;
          const cg = g.createRadialGradient(x, y, 0, x, y, r);
          cg.addColorStop(0, 'rgba(2,3,9,0.1)'); cg.addColorStop(1, 'rgba(2,3,9,0)');
          g.fillStyle = cg; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
        }
      }
      g.globalCompositeOperation = 'lighter';
    };
    nebula(W * 0.82, H * 0.2, Math.min(W, H) * 0.16);
    nebula(W * 0.14, H * 0.78, Math.min(W, H) * 0.12);
    // distant galaxies: small ellipticals and a few tiny two-armed spirals
    for (let i = 0; i < Math.round(W * H / 9000); i++) {
      const x = Math.random() * W, y = Math.random() * H, r = rnd(1.5, 5), rot = rnd(0, Math.PI), fl = rnd(0.25, 0.9);
      g.save(); g.translate(x, y); g.rotate(rot); g.scale(1, fl);
      const warm = Math.random() < 0.6;
      const cg = g.createRadialGradient(0, 0, 0, 0, 0, r);
      cg.addColorStop(0, warm ? 'rgba(255,235,205,0.55)' : 'rgba(215,225,255,0.5)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = cg; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
      if (!warm && r > 3.5) {
        g.strokeStyle = 'rgba(170,195,255,0.22)'; g.lineWidth = 0.7;
        for (const s0 of [0, Math.PI]) {
          g.beginPath();
          for (let k = 0; k <= 20; k++) { const th = s0 + k / 20 * 3.2, rr = r * 0.3 * Math.exp(0.35 * th); const px = Math.cos(th) * rr, py = Math.sin(th) * rr; k ? g.lineTo(px, py) : g.moveTo(px, py); }
          g.stroke();
        }
      }
      g.restore();
    }
    // ordinary stars in real star colours, a few bright ones with a soft glow
    const SC_ = ['#9bb0ff', '#aabfff', '#cad7ff', '#f8f7ff', '#fff4ea', '#ffd2a1', '#ffcc6f'];
    for (let i = 0; i < W * H / 900; i++) {
      const x = Math.random() * W, y = Math.random() * H, c = pick(SC_), b = Math.pow(Math.random(), 3);
      g.globalAlpha = 0.25 + 0.75 * b; g.fillStyle = c;
      const s = 0.5 + b * 1.2; g.fillRect(x, y, s, s);
      if (b > 0.85) {
        const cg = g.createRadialGradient(x, y, 0, x, y, 6);
        cg.addColorStop(0, c + '55'); cg.addColorStop(1, c + '00');
        g.fillStyle = cg; g.beginPath(); g.arc(x, y, 6, 0, TAU); g.fill();
      }
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    if (skyMode === 'nebula' && ready(photos.nebula)) photoSky(bgCanvas, photos.nebula, 0.62, 0.55, 0.72);
    else if (skyMode === 'field' && ready(photos.field)) photoSky(bgCanvas, photos.field, 0.5, 0.5, 0.35);
    else if (ready(photos.cluster)) photoSky(bgCanvas, photos.cluster, 0.3, 0.45, 0.6);
    // the Sun's close-up sits in front of the Lagoon and Trifid nebulae
    if (ready(photos.nebula)) photoSky(bgSun, photos.nebula, 0.62, 0.55, 0.62);
    else { bgSun.width = bgCanvas.width; bgSun.height = bgCanvas.height; bgSun.getContext('2d').drawImage(bgCanvas, 0, 0); }
    if (ready(photos.spiral)) photoSky(bgClose, photos.spiral, 0.6, 0.62, 0.5);
    else { bgClose.width = bgCanvas.width; bgClose.height = bgCanvas.height; bgClose.getContext('2d').drawImage(bgCanvas, 0, 0); }
  }
  addEventListener('resize', resize);
  resize();

  // ---------- bodies ----------
  // Overview distances are compressed so Mercury and Neptune fit on one screen
  const dist = a => 0.95 + 1.3 * Math.log(1 + a * 1.2);

  // L0/n: mean longitude at J2000 and its daily rate (circular-orbit approximation of the real positions).
  // rot: sidereal day in Earth days; tiltAx: axial tilt in degrees (over 90° means retrograde spin).
  // p1: orbital period at 1 planet radius in days, for Keplerian ring speeds.
  const PLANETS = [
    { id: 'mercury', name: 'Меркурий', a: 0.387, L0: 252.25, n: 4.09233, r: 2.8, col: ['#e6dfd6', '#a79d93', '#4a4440'],
      rot: 58.646, tiltAx: 0.03, p1: 0.0705, halo: '190,180,170',
      facts: 'Диаметр 4 879 км · 0,39 а. е. · год 88 дней · сутки 58,6 земных · спутников нет',
      note: 'Самая маленькая планета. Солнечные сутки на ней длятся 176 земных дней, дольше её года.' },
    { id: 'venus', name: 'Венера', a: 0.723, L0: 181.98, n: 1.60213, r: 4.2, col: ['#fff2d2', '#e3be7c', '#7a5a2a'],
      rot: 243.02, tiltAx: 177.4, p1: 0.0602, halo: '255,220,150',
      facts: 'Диаметр 12 104 км · 0,72 а. е. · год 225 дней · сутки 243 земных, вращение обратное · спутников нет',
      note: 'Самая горячая планета: под плотными облаками около 465 °C.' },
    { id: 'earth', name: 'Земля', a: 1.0, L0: 100.46, n: 0.98561, r: 4.4, col: ['#d8f0ff', '#3d86ff', '#0b2a6b'],
      rot: 0.99727, tiltAx: 23.44, p1: 0.0586, halo: '120,180,255',
      facts: 'Диаметр 12 742 км · 1 а. е. = 150 млн км · год 365,25 дня · сутки 23 ч 56 мин · наклон оси 23,4° · 1 спутник',
      note: 'Единственная известная планета с жизнью. Вокруг летают станции МКС и Тяньгун, телескопы Хаббл и Чандра, метеоспутники и тысячи спутников связи и навигации; на ночной стороне горят города.',
      moons: [{ name: 'Луна', a: 60.3, P: 27.32, size: 0.273, col: ['#ffffff', '#b8b8b8', '#3a3a3a'], inc: -18.3 }] },
    { id: 'mars', name: 'Марс', a: 1.524, L0: 355.43, n: 0.52403, r: 3.4, col: ['#ffd2b8', '#d4623a', '#4e1a0c'],
      rot: 1.02596, tiltAx: 25.19, p1: 0.0694, halo: '255,150,110',
      facts: 'Диаметр 6 779 км · 1,52 а. е. · год 687 дней · сутки 24 ч 37 мин · наклон оси 25,2° · 2 спутника',
      note: 'Здесь гора Олимп, высочайший вулкан Солнечной системы, около 22 км. Вокруг работают орбитальные аппараты Земли: MRO, MAVEN, Mars Express, TGO, Тяньвэнь-1 и Аль-Амаль.',
      moons: [{ name: 'Фобос', a: 2.76, P: 0.319, size: 0.05, col: ['#d8c8b8', '#8a7868', '#2a2018'] },
              { name: 'Деймос', a: 6.92, P: 1.263, size: 0.04, col: ['#e0d0c0', '#9a8878', '#2a2018'] }] },
    { id: 'jupiter', name: 'Юпитер', a: 5.203, L0: 34.35, n: 0.08309, r: 10, col: ['#fff0dc', '#d9b38c', '#5e4026'],
      rot: 0.41354, tiltAx: 3.13, p1: 0.1235, halo: '255,210,160',
      rings: [[1.72, 1.81, 0.12, ['#8a6a50', '#a88a6a']], [1.4, 1.71, 0.05, ['#6a5040']]],
      facts: 'Диаметр 139 820 км · 5,2 а. е. · год 11,9 лет · сутки 9 ч 56 мин · 95 спутников',
      note: 'Большое Красное Пятно — шторм шире всей Земли. Четыре крупных спутника открыл Галилей в 1610 году.',
      moons: [{ name: 'Ио', a: 5.9, P: 1.769, size: 0.065, col: ['#fff6b0', '#e0c050', '#5a4010'] },
              { name: 'Европа', a: 9.4, P: 3.551, size: 0.055, col: ['#ffffff', '#d9cbb0', '#4a4030'] },

  const SUN = { id: 'sun', name: 'Солнце', r: 17, rot: 25.38, tiltAx: 7.25, isSun: true,

  PLANETS.forEach(p => { p.d = dist(p.a); p.sx = p.sy = -999; p.sr = 0; });

  const BODIES = [SUN, ...PLANETS];

  // ---------- time: days since J2000.0 ----------
  const J2000 = Date.UTC(2000, 0, 1, 12);
  const nowDays = () => (Date.now() - J2000) / 86400000;
  let days = nowDays(), speed = 10;
  const fmtDay = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  const fmtTime = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });

  // ---------- overview particles ----------
  const belt = [], kuiper = [], wind = [];
  for (let i = 0; i < (small ? 2200 : 3500); i++) {
    const a = 2.1 + Math.pow(Math.random(), 0.9) * 1.2;
    belt.push({ d: dist(a) + gauss() * 0.02, L: Math.random() * 360, n: 0.98561 / Math.pow(a, 1.5), y: gauss() * 0.04,
      c: pick(['#b8a690', '#8f8272', '#d6c7b0', '#6f655a']), s: rnd(0.6, 1.4), o: rnd(0.2, 0.55) });
  }
  for (let i = 0; i < (small ? 2200 : 3500); i++) {
    const a = 30 + Math.pow(Math.random(), 1.5) * 20;
    kuiper.push({ d: dist(a) + gauss() * 0.05, L: Math.random() * 360, n: 0.98561 / Math.pow(a, 1.5), y: gauss() * 0.12,

  // ---------- overview camera ----------
  let yaw = 0, tilt = 0.95, vYaw = 0;
  let focus = null, fx = 0, fz = 0;
  let M_ov = camM(yaw, tilt);
  function project(x, y, z) {
    const dx = x - fx, dz = z - fz, M = M_ov;
    const a = M[0] * dx + M[1] * y + M[2] * dz, b = M[3] * dx + M[4] * y + M[5] * dz, depth = M[6] * dx + M[7] * y + M[8] * dz;
    const k = 22 / (22 - depth * 0.6);
    return [W / 2 + a * zoom * k, H / 2 + b * zoom * k, depth, k];
  }
  const sizeK = () => Math.pow(zoom / zoom0, 0.7);
  function planetPos(p) {
    if (p.isSun) return [0, 0, 0];
    if (p.kind) return p.wpos || [0, 0, 0];
    const L = (p.L0 + p.n * days) * DEG;
    return [p.d * Math.cos(L), 0, -p.d * Math.sin(L)];
  }

  function sphere(x, y, r, col, lx, ly) {
    const g = ctx.createRadialGradient(x + lx * r * 0.5, y + ly * r * 0.5, r * 0.08, x, y, r * 1.05);
    g.addColorStop(0, col[0]); g.addColorStop(0.45, col[1]); g.addColorStop(1, col[2]);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }

  function drawSunOverview() {
    const [x, y, , k] = project(0, 0, 0);
    const r = SUN.r * sizeK() * k;
    ctx.globalCompositeOperation = 'lighter';
    const halo = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 6);
    halo.addColorStop(0, 'rgba(255,190,90,0.45)'); halo.addColorStop(0.3, 'rgba(255,120,40,0.12)'); halo.addColorStop(1, 'rgba(255,100,30,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(x, y, r * 6, 0, TAU); ctx.fill();
    if (wind.length < 260 && !reduce) for (let i = 0; i < 4; i++) wind.push({ a: Math.random() * TAU, d: 1, v: rnd(0.6, 1.6), life: 1 });
    for (const w of wind) {
      ctx.fillStyle = `rgba(255,${180 + w.life * 60 | 0},120,${(w.life * 0.7).toFixed(2)})`;
      ctx.fillRect(x + Math.cos(w.a) * r * w.d, y + Math.sin(w.a) * r * w.d, 1.2, 1.2);
    }
    ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, r * 0.1, x, y, r);
    g.addColorStop(0, '#fffbe8'); g.addColorStop(0.5, '#ffd36b'); g.addColorStop(0.85, '#ff9a2e'); g.addColorStop(1, '#e0601a');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    SUN.sx = x; SUN.sy = y; SUN.sr = r;
  }

  function drawOrbits() {
    ctx.lineWidth = 1;
    for (const p of PLANETS) {
      ctx.strokeStyle = p === focus ? 'rgba(255,205,130,0.45)' : 'rgba(150,175,255,0.13)';
      ctx.beginPath();
      for (let i = 0; i <= 120; i++) {
        const L = (i / 120) * TAU;
        const [x, y] = project(p.d * Math.cos(L), 0, -p.d * Math.sin(L));
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
  }

  function drawDust(list, dDays) {
    for (const q of list) {
      q.L += q.n * dDays;
      const L = q.L * DEG;
      const [x, y] = project(q.d * Math.cos(L), q.y, -q.d * Math.sin(L));
      ctx.globalAlpha = q.o; ctx.fillStyle = q.c; ctx.fillRect(x, y, q.s, q.s);
    }
    ctx.globalAlpha = 1;
  }

  function drawPlanetOverview(p) {
    const [x, y, , k] = p.screen;
    const pr = p.r * sizeK() * k;
    p.sx = x; p.sy = y; p.sr = pr;
    let lx = SUN.sx - x, ly = SUN.sy - y; const ll = Math.hypot(lx, ly) || 1; lx /= ll; ly /= ll;
    const glow = ctx.createRadialGradient(x, y, pr * 0.8, x, y, pr * 2.2);
    glow.addColorStop(0, p.col[1] + '55'); glow.addColorStop(1, p.col[1] + '00');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, pr * 2.2, 0, TAU); ctx.fill();
    if (GLR && pr > 1.2) {
      // overview bodies are tiny, so their shaded image is refreshed a few times a second and reused in between
      const c = p.ov || (p.ov = { cv: document.createElement('canvas'), t: -1, pr: 0, ext: 1 });
      if (t - c.t > 0.2 || Math.abs(pr - c.pr) > pr * 0.04) {
        const [wx, , wz] = planetPos(p), wl = Math.hypot(wx, wz) || 1;
        const o = renderBodyGL(p, pr, M_ov, [-wx / wl, 0, -wz / wl], (TAU * days / p.rot) % TAU, DPR, false, t);
        c.ext = o.ext;
        if (c.cv.width !== o.px) c.cv.width = c.cv.height = o.px;
        const cc = c.cv.getContext('2d');
        cc.clearRect(0, 0, o.px, o.px);
        cc.drawImage(glc, 0, glc.height - o.px, o.px, o.px, 0, 0, o.px, o.px);
        c.t = t; c.pr = pr;
      }
      ctx.drawImage(c.cv, x - c.ext * pr, y - c.ext * pr, 2 * c.ext * pr, 2 * c.ext * pr);
    } else sphere(x, y, pr, p.col, lx, ly);
  }

  let showNames = true;
  function drawNamesOverview() {
    ctx.font = '10px "JetBrains Mono", ui-monospace, Menlo, monospace';
    ctx.textBaseline = 'middle';
    const taken = [];   // skip a label that would overlap one already drawn (inner planets crowd together)
    const sr = SUN.sr * 1.3;   // keep labels off the Sun's disc
    for (let dy = -sr; dy <= sr; dy += 10) taken.push([SUN.sx - sr, SUN.sy + dy, 2 * sr]);
    const order = focus ? [focus, ...PLANETS.filter(p => p !== focus)] : [...PLANETS].reverse();
    for (const p of order) {
      if (p.isSun) continue;
      const label = p.name.toUpperCase(), w = ctx.measureText(label).width + 4, y = p.sy;
      let x = p.sx + p.sr + 6;
      if (x + w > W - 8) x = p.sx - p.sr - 6 - w;   // flip to the left near the screen edge
      if (taken.some(r => x < r[0] + r[2] && x + w > r[0] && Math.abs(y - r[1]) < 11)) continue;
      taken.push([x, y, w]);
      ctx.fillStyle = p === focus ? 'rgba(255,215,150,0.95)' : 'rgba(205,215,245,0.7)';
      ctx.fillText(label, x, y);
    }
    return taken;
  }

  // glowing trail along each orbit, brightest just behind the planet
  function drawOrbitTrails() {
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    const N = 140;
    for (const p of PLANETS) {
      const c = hexRgb(p.col[1]), Lp = (p.L0 + p.n * days) * DEG;
      let prev = project(p.d * Math.cos(Lp), 0, -p.d * Math.sin(Lp));
      for (let i = 1; i <= N; i++) {
        const L = Lp - i / N * TAU, cur = project(p.d * Math.cos(L), 0, -p.d * Math.sin(L));
        const k = Math.exp(-(i / N * TAU) / 1.1);
        const a = (p === focus ? 0.14 : 0.06) + 0.34 * k;
        ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`;
        ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(cur[0], cur[1]); ctx.stroke();
        prev = cur;
      }
    }
  }

  // asteroid belt with the Kirkwood gaps, Jupiter's Trojans at L4/L5, and the Kuiper belt with its plutino clump
  function buildBeltGpu() {
    const data = [], k = small ? 1 : 1.8;
    const push = (a, L0, y, nDeg, size, br, tw, c) => data.push(dist(a) + gauss() * 0.012, L0, y, nDeg * DEG, size, br, tw, 0, c[0] / 255, c[1] / 255, c[2] / 255);
    const AST = [[190, 170, 140], [150, 135, 115], [220, 200, 160], [125, 112, 100]], ICE = [[160, 180, 225], [130, 150, 195], [205, 218, 248]];
    const gaps = [2.502, 2.825, 2.958, 3.279];
    for (let i = 0; i < 9000 * k; i++) {
      let a;
      do a = 2.06 + Math.pow(Math.random(), 0.9) * 1.25; while (gaps.some(g => Math.abs(a - g) < 0.018) && Math.random() < 0.9);
      const spark = Math.random() < 0.03;
      push(a, rnd(0, TAU), gauss() * 0.035, 0.98561 / Math.pow(a, 1.5), spark ? rnd(1.3, 2) : rnd(0.5, 1.1), spark ? 0.6 : rnd(0.09, 0.26), spark ? rnd(0, TAU) : -1, spark ? [255, 232, 190] : pick(AST));
    }
    const jup = PLANETS.find(o => o.id === 'jupiter');
    for (let i = 0; i < 1200 * k; i++) {
      const lead = Math.random() < 0.5 ? 60 : -60;
      // clouds 60° ahead of and behind Jupiter's current position, wide and faint like the real swarms
      push(5.2 + gauss() * 0.9, (jup.L0 + jup.n * days + lead + gauss() * 16) * DEG, gauss() * 0.12, jup.n, rnd(0.5, 1.1), rnd(0.08, 0.22), -1, pick(AST));
    }
    for (let i = 0; i < 9000 * k; i++) {
      const r = Math.random();
      const a = r < 0.25 ? 39.4 + gauss() * 0.6 : r < 0.85 ? rnd(42, 48) : 48 + Math.pow(Math.random(), 2) * 50;
      const spark = Math.random() < 0.02;
      push(a, rnd(0, TAU), gauss() * (a > 48 ? 0.35 : 0.13), 0.98561 / Math.pow(a, 1.5), spark ? rnd(1.3, 2) : rnd(0.5, 1.1), spark ? 0.7 : rnd(0.14, 0.4), spark ? rnd(0, TAU) : -1, pick(ICE));
    }
    const arr = new Float32Array(data), buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
    return { buf, n: arr.length / 11, day0: days };
  }

  function renderOverviewGL(t) {
    if (!SC) SC = initScene();
    if (!SC.beltData) SC.beltData = buildBeltGpu();
    const T = ensureTargets();
    gl.bindFramebuffer(gl.FRAMEBUFFER, T.scene.fb);
    gl.viewport(0, 0, T.w, T.h);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    // belts
    const B = SC.beltData, U = SC.beltU, a = SC.beltA;
    gl.useProgram(SC.belt);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.uniformMatrix3fv(U.uM, false, new Float32Array(tr(M_ov)));
    gl.uniform2f(U.uF, fx, fz);
    gl.uniform2f(U.uHalf, W / 2, H / 2);
    gl.uniform2f(U.uView, T.w, T.h);
    gl.uniform1f(U.uZoom, zoom);
    gl.uniform1f(U.uDpr, DPR);
    gl.uniform1f(U.uSizeK, Math.min(2.2, Math.sqrt(zoom / zoom0)));
    gl.uniform1f(U.uDays, days - B.day0);
    gl.uniform1f(U.uTime, t);
    gl.uniform1f(U.uStreak, speed * 0.035);
    gl.bindBuffer(gl.ARRAY_BUFFER, B.buf);
    gl.enableVertexAttribArray(a.orb); gl.vertexAttribPointer(a.orb, 4, gl.FLOAT, false, 44, 0);
    gl.enableVertexAttribArray(a.look); gl.vertexAttribPointer(a.look, 4, gl.FLOAT, false, 44, 16);
    gl.enableVertexAttribArray(a.col); gl.vertexAttribPointer(a.col, 3, gl.FLOAT, false, 44, 32);
    gl.drawArrays(gl.POINTS, 0, B.n);
    gl.disableVertexAttribArray(a.look); gl.disableVertexAttribArray(a.col);
    // Sun and planets, farthest first
    const bodies = [SUN, ...PLANETS].map(o => {
      const [x, y, z] = planetPos(o), sp = project(x, y, z);
      return { o, sp };
    }).sort((p, q) => p.sp[2] - q.sp[2]);
    for (const { o, sp } of bodies) {
      const pr = o.r * sizeK() * sp[3];
      o.sx = sp[0]; o.sy = sp[1]; o.sr = pr;
      const [wx, , wz] = planetPos(o), wl = Math.hypot(wx, wz) || 1;
      const Lw = o.isSun ? [0, 0, 1] : [-wx / wl, 0, -wz / wl];
      renderBodyGL(o, pr, M_ov, Lw, (TAU * days / o.rot) % TAU, DPR, false, t, { cx: sp[0] * DPR, cy: sp[1] * DPR, Rpx: pr * DPR, w: T.w, h: T.h, over: true });
    }
    gl.disable(gl.BLEND);
    bloomAndCompose(0.5, 1.0, 1);
  }

  function drawOverview(dDays) {
    M_ov = camM(yaw, tilt);
    updateSmall();
    if (GLR) {
      drawOrbitTrails();
      if (showSmall) { drawSmallOrbits(); drawStreams(); }
      // soft corona under the GPU image
      const [x, y, , k] = project(0, 0, 0), r = SUN.r * sizeK() * k;
      ctx.globalCompositeOperation = 'lighter';
      const halo = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 7);
      halo.addColorStop(0, 'rgba(255,180,90,0.35)'); halo.addColorStop(0.35, 'rgba(255,120,40,0.08)'); halo.addColorStop(1, 'rgba(255,100,30,0)');
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(x, y, r * 7, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      renderOverviewGL(t);
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(glc, 0, 0); ctx.restore();
      if (showSmall) drawSmallBodies();
      if (showNames) { const taken = drawNamesOverview(); drawProbes(taken); if (showSmall) drawSmallLabels(taken); }
      return;
    }
    drawOrbits();
    ctx.globalCompositeOperation = 'lighter';
    drawDust(kuiper, dDays);
    drawDust(belt, dDays);
    ctx.globalCompositeOperation = 'source-over';
    for (const w of wind) { w.d += w.v * frameDt * 2; w.life -= frameDt * 0.5; }
    for (let i = wind.length - 1; i >= 0; i--) if (wind[i].life <= 0) wind.splice(i, 1);
    for (const p of PLANETS) { const [x, y, z] = planetPos(p); p.screen = project(x, y, z); }
    const sunDepth = project(0, 0, 0)[2];
    const order = [...PLANETS].sort((a, b) => a.screen[2] - b.screen[2]);
    let sunDrawn = false;
    for (const p of order) {
      if (!sunDrawn && p.screen[2] > sunDepth) { drawSunOverview(); sunDrawn = true; }
      drawPlanetOverview(p);
    }
    if (!sunDrawn) drawSunOverview();
    if (showNames) { drawNamesOverview(); drawProbes(); }
  }

  // =====================================================================
  // Close-up scene: the body spinning on its tilted axis, with its rings, a sparkling dust disc,
  // its real major moons and, for Earth, stations and satellites
  // =====================================================================
  function surfaceColor(b, x, y, z, lat, lon) {
    const n = fbm(x * 1.8 + 5, y * 1.8, z * 1.8, 5);
    const alat = Math.abs(lat);
    switch (b.id) {
      case 'sun': {
        const g = fbm(x * 9, y * 9, z * 9, 3);
        let c = mix([255, 120, 20], [255, 235, 150], smooth(clamp((g - 0.3) * 2.2, 0, 1)));
        if (alat < 35 * DEG && alat > 6 * DEG && fbm(x * 4 + 9, y * 4, z * 4, 3) > 0.74) c = [120, 50, 10];
        return c;
      }
      case 'mercury': {
        let c = mix([105, 100, 96], [205, 198, 190], n);
        if (fbm(x * 7, y * 7, z * 7, 2) > 0.68) c = mix(c, [70, 66, 62], 0.6);
        return c;
      }
      case 'venus': {
        const b2 = Math.sin(lat * 6 + fbm(x * 2.5, y * 2.5 + 3, z * 2.5) * 5);
        return mix(mix([205, 165, 105], [245, 225, 180], n), [250, 238, 205], (b2 + 1) * 0.25);
      }
      case 'earth': {
        if (alat > (68 + (n - 0.5) * 30) * DEG) return [235, 242, 248];
        if (n > 0.55) {
          const dry = alat < 33 * DEG && fbm(x * 3 + 2, y * 3, z * 3, 3) > 0.52;
          return dry ? mix([190, 160, 110], [215, 190, 140], n) : mix([50, 100, 45], [120, 135, 70], (n - 0.55) * 4);
        }
        return mix([10, 35, 105], [35, 95, 175], smooth(clamp((n - 0.3) * 4, 0, 1)));
      }
      case 'mars': {
        if (alat > 76 * DEG) return [240, 236, 230];
        let c = mix([165, 70, 35], [220, 135, 85], n);
        if (fbm(x * 2.2 + 7, y * 2.2, z * 2.2, 4) > 0.58) c = mix(c, [100, 50, 32], 0.6);
        return c;
      }
      case 'jupiter': {
        const b2 = Math.sin(lat * 15 + fbm(x * 3, y * 3, z * 3) * 2.4);
        let c = b2 > 0.5 ? [240, 228, 205] : b2 > 0 ? [215, 180, 140] : b2 > -0.5 ? [190, 130, 85] : [150, 95, 65];
        c = mix(c, [255, 245, 230], (n - 0.5) * 0.8);
        const dl = (lat + 22 * DEG) / (6 * DEG), dn = Math.atan2(Math.sin(lon), Math.cos(lon)) / (13 * DEG);
        if (dl * dl + dn * dn < 1) c = mix([200, 85, 55], [225, 120, 80], dl * dl + dn * dn);
        return c;
      }
      case 'saturn': {
        const b2 = Math.sin(lat * 11 + fbm(x * 2, y * 2, z * 2) * 1.2);
        return mix(mix([210, 180, 120], [240, 222, 170], (b2 + 1) / 2), [255, 240, 205], (n - 0.5) * 0.6);
      }
      case 'uranus':
        return mix([130, 205, 215], [175, 235, 240], (Math.sin(lat * 5) + 1) * 0.3 + (n - 0.5) * 0.4);
      case 'neptune': {
        let c = mix([30, 60, 185], [70, 110, 235], n);
        const dl = (lat + 20 * DEG) / (7 * DEG), dn = Math.atan2(Math.sin(lon - 0.7), Math.cos(lon - 0.7)) / (14 * DEG);
        if (dl * dl + dn * dn < 1) c = [20, 32, 110];
        const st = fbm(x * 3 + 1, y * 14, z * 3, 3);   // thin bright cirrus streaks
        if (st > 0.66) c = mix(c, [215, 230, 255], smooth(clamp((st - 0.66) / 0.08, 0, 1)) * 0.8);
        return c;
      }
    }
    return [200, 200, 200];
  }

  // =====================================================================
  // WebGL body renderer. Each body is shaded per pixel from a procedural equirectangular texture:
  // soft terminator, ocean glint, clouds, city lights, limb darkening, atmosphere, and for ringed
  // planets a per-pixel ring with the real radial profile, the planet's shadow on the rings and the
  // rings' shadow on the planet. The result is drawn into the 2D scene so moons, satellites and
  // particles still sort in front of or behind it.
  // =====================================================================
  const glc = document.createElement('canvas');
  const gl = glc.getContext('webgl', { premultipliedAlpha: true, alpha: true, preserveDrawingBuffer: true, antialias: false });
  const GLR = gl ? initGL() : null;

  function initGL() {
    const VS = `
      attribute vec2 aPos; uniform float uExt, uRpx; uniform vec2 uCenter, uView; varying vec2 vP;
      void main() {
        vP = vec2(aPos.x, -aPos.y) * uExt;
        vec2 pos = uCenter + vP * uRpx;
        gl_Position = vec4(pos.x / uView.x * 2.0 - 1.0, 1.0 - pos.y / uView.y * 2.0, 0.0, 1.0);
      }`;
    const FS = `
      precision highp float;
      varying vec2 vP;
      uniform sampler2D uTex, uCloud, uRing;
      uniform mat3 uMb, uMt;
      uniform vec3 uLc, uLt, uAtm;
      uniform float uAtmK, uBand, uSun, uSpec, uHasCloud, uHasRing, uRin, uRout, uPix, uTime, uCloudOff, uRingK;
      const float PI = 3.14159265;
      vec2 sphUV(vec3 b) { return vec2(atan(b.z, b.x) / (2.0 * PI) + 0.5, 0.5 - asin(clamp(b.y, -1.0, 1.0)) / PI); }
      float ringA(float rr) {
        if (rr < uRin || rr > uRout) return 0.0;
        return texture2D(uRing, vec2((rr - uRin) / (uRout - uRin), 0.5)).a;
      }
      vec3 shadeSurface(vec3 c) {
        vec3 b = uMb * c;
        vec2 uv = sphUV(b);
        vec4 t = texture2D(uTex, uv);
        if (uSun > 0.5) {
          vec4 t2 = texture2D(uTex, uv + vec2(0.004 * sin(uTime * 0.7), 0.003 * cos(uTime * 0.9)));
          vec3 sc = mix(t.rgb, t2.rgb, 0.5 + 0.5 * sin(uTime * 1.3 + t.r * 12.0));
          return sc * (0.35 + 0.65 * pow(c.z, 0.5)) * vec3(1.08, 1.0, 0.92);
        }
        float ndl = dot(c, uLc);
        float soft = smoothstep(-0.12, 0.18, ndl);
        float lit = max(ndl, 0.0) * 0.9 + soft * 0.1;
        float cl = uHasCloud > 0.5 ? texture2D(uCloud, uv + vec2(uCloudOff, 0.0)).r : 0.0;
        vec3 res = t.rgb * (0.018 + lit);
        if (uSpec > 0.5) {
          float ocean = step(t.r + t.g * 0.5, t.b * 0.95);
          vec3 h = normalize(uLc + vec3(0.0, 0.0, 1.0));
          res += vec3(1.0, 0.92, 0.8) * pow(max(dot(c, h), 0.0), 70.0) * ocean * soft * 0.55 * (1.0 - cl);
          res += vec3(1.0, 0.72, 0.38) * t.a * (1.0 - soft) * (1.0 - cl) * 1.1;
        }
        res = mix(res, vec3(0.92, 0.95, 1.0) * (0.02 + lit), cl * 0.9);
        res *= mix(1.0, 0.45 + 0.55 * c.z, uBand);
        if (uHasRing > 0.5 && abs(uLt.y) > 0.002) {
          vec3 q = uMt * c;
          float s = -q.y / uLt.y;
          if (s > 0.0) { vec3 h2 = q + s * uLt; res *= 1.0 - 0.85 * ringA(length(h2.xz)); }
        }
        res += uAtm * uAtmK * pow(1.0 - c.z, 3.0) * (soft * 0.85 + 0.05);
        res += vec3(0.9, 0.95, 1.0) * pow(1.0 - c.z, 7.0) * soft * uBand * 0.6;        // glossy rim light
        vec3 hh = normalize(uLc + vec3(0.0, 0.0, 1.0));
        res += vec3(1.0) * pow(max(dot(c, hh), 0.0), 24.0) * uBand * 0.12 * soft;      // soft sheen
        return res;
      }
      void main() {
        vec2 p = vP;
        float r = length(p);
        vec4 col = vec4(0.0);
        float zs = -10.0;
        if (r < 1.0) {
          float z = sqrt(1.0 - r * r);
          zs = z;
          float cov = 1.0 - smoothstep(1.0 - uPix * 1.5, 1.0, r);
          col = vec4(shadeSurface(vec3(p, z)) * cov, cov);
        }
        if (uSun < 0.5 && uAtmK > 0.0 && r > 0.9) {
          float g = exp(-max(r - 1.0, 0.0) * 30.0) * smoothstep(0.9, 1.0, r);
          float side = clamp(dot(p / max(r, 1e-4), uLc.xy) * 0.9 + 0.25, 0.0, 1.0);
          float a = g * side * uAtmK * 0.55;
          col.rgb += uAtm * a * (1.0 - col.a);
          col.a += a * (1.0 - col.a);
        }
        if (uHasRing > 0.5) {
          vec3 q0 = uMt * vec3(p, 0.0), qz = uMt * vec3(0.0, 0.0, 1.0);
          if (abs(qz.y) > 1e-4) {
            float z = -q0.y / qz.y;
            vec3 q = q0 + z * qz;
            float rr = length(q.xz);
            if (rr > uRin && rr < uRout && !(r < 1.0 && z < zs)) {
              vec4 rt = texture2D(uRing, vec2((rr - uRin) / (uRout - uRin), 0.5));
              float k = 0.55 + 0.45 * smoothstep(0.0, 0.25, abs(uLt.y));
              if (sign(qz.y) != sign(uLt.y)) k *= 0.55;                      // looking at the unlit face
              float ra = rt.a * uRingK;
              float d = dot(q, uLt);
              if (d < 0.0) {   // planet's shadow: soft penumbra; shaded ice stays translucent instead of a black slab
                float sh = smoothstep(0.93, 1.04, sqrt(max(dot(q, q) - d * d, 0.0)));
                k *= mix(0.1, 1.0, sh); ra *= mix(0.4, 1.0, sh);
              }
              col = vec4(rt.rgb * k * ra, ra) + col * (1.0 - ra);
            }
          }
        }
        gl_FragColor = col;
      }`;
    const sh = (type, src) => {
      const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o);
      if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o));
      return o;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const aPos = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
    const U = {};
    ['uTex', 'uCloud', 'uRing', 'uMb', 'uMt', 'uLc', 'uLt', 'uAtm', 'uAtmK', 'uBand', 'uSun', 'uSpec', 'uHasCloud', 'uHasRing',
     'uRin', 'uRout', 'uPix', 'uTime', 'uCloudOff', 'uExt', 'uRpx', 'uCenter', 'uView', 'uRingK'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
    gl.uniform1i(U.uTex, 0); gl.uniform1i(U.uCloud, 1); gl.uniform1i(U.uRing, 2);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    const blank = makeTex(new Uint8Array(4), 1, 1, gl.CLAMP_TO_EDGE);
    return { U, blank, prog, buf, aPos, sh };
  }

  // =====================================================================
  // GPU close-up scene: tens of thousands of ring and dust particles, each drawn as a soft streak
  // stretched along its orbit (motion blur) and larger when nearer the camera, then a bloom pass
  // so bright parts glow like in the reference video.
  // =====================================================================
  const tr = M => [M[0], M[3], M[6], M[1], M[4], M[7], M[2], M[5], M[8]];
  let SC = null;
  const PART_FS = `
      precision mediump float;
      varying vec3 vCol; varying vec2 vDir; varying float vLen, vWid, vSize;
      void main() {
        vec2 q = (gl_PointCoord - 0.5) * vSize;
        float al = dot(q, vDir), ac = dot(q, vec2(-vDir.y, vDir.x));
        float e = al * al / (vLen * vLen * 0.25 + 0.01) + ac * ac / (vWid * vWid * 0.25 + 0.01);
        float k = exp(-e * 2.2);
        if (k < 0.01) discard;
        vec3 c = vCol * k;
        gl_FragColor = vec4(c, max(c.r, max(c.g, c.b)));
      }`;
  function initScene() {
    const link = (vs, fs) => {
      const pr = gl.createProgram();
      gl.attachShader(pr, GLR.sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, GLR.sh(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(pr);
      return pr;
    };
    const part = link(`
      attribute vec4 aOrb;   // radius, start angle, height, angular speed (rad/day)
      attribute vec4 aLook;  // size (css px), brightness, twinkle phase (<0: none), unused
      attribute vec3 aCol;
      uniform mat3 uMr; uniform vec3 uLt;
      uniform vec2 uCenter, uView;
      uniform float uRpx, uDpr, uDays, uTime, uStreak, uAlpha, uOut;
      varying vec3 vCol; varying vec2 vDir; varying float vLen, vWid, vSize;
      void main() {
        float a = aOrb.y + aOrb.w * uDays, r = aOrb.x;
        vec3 q = vec3(r * cos(a), aOrb.z, r * sin(a));
        vec3 c = uMr * q;
        vec3 tc = uMr * vec3(-sin(a), 0.0, cos(a));
        float vis = (c.z < 0.0 && dot(c.xy, c.xy) < 1.0) ? 0.0 : 1.0;    // behind the planet
        float d = dot(q, uLt);
        if (d < 0.0) vis *= mix(0.06, 1.0, smoothstep(0.93, 1.04, sqrt(max(dot(q, q) - d * d, 0.0))));   // in the planet's shadow
        float tw = aLook.z >= 0.0 ? 0.5 + 0.5 * sin(uTime * 2.2 + aLook.z) : 1.0;
        float wid = aLook.x * uDpr * (1.0 + 0.3 * c.z / uOut);
        float dl = length(tc.xy);
        vec2 dir = dl > 1e-4 ? tc.xy / dl : vec2(1.0, 0.0);
        float len = wid * 1.6 + min(aOrb.w * r * uRpx * uStreak * dl, 16.0 * uDpr);
        vSize = len + 2.0;
        vec2 pos = uCenter + c.xy * uRpx;
        gl_Position = vis > 0.0 ? vec4(pos.x / uView.x * 2.0 - 1.0, 1.0 - pos.y / uView.y * 2.0, 0.0, 1.0) : vec4(2.0, 2.0, 0.0, 1.0);
        gl_PointSize = vSize;
        vCol = aCol * aLook.y * tw * vis * uAlpha;
        vDir = dir; vLen = len; vWid = wid;
      }`, PART_FS);
    const belt = link(`
      attribute vec4 aOrb;   // compressed distance, start longitude, height, angular speed (rad/day)
      attribute vec4 aLook; attribute vec3 aCol;
      uniform mat3 uM; uniform vec2 uF, uHalf, uView;
      uniform float uZoom, uDpr, uDays, uTime, uStreak, uSizeK;
      varying vec3 vCol; varying vec2 vDir; varying float vLen, vWid, vSize;
      void main() {
        float L = aOrb.y + aOrb.w * uDays, d = aOrb.x;
        vec3 c = uM * vec3(d * cos(L) - uF.x, aOrb.z, -d * sin(L) - uF.y);
        float k = 22.0 / (22.0 - c.z * 0.6);
        vec2 pos = (uHalf + c.xy * uZoom * k) * uDpr;
        vec3 tc = uM * vec3(-sin(L), 0.0, -cos(L));
        float dl = length(tc.xy);
        vec2 dir = dl > 1e-4 ? tc.xy / dl : vec2(1.0, 0.0);
        float wid = aLook.x * uDpr * uSizeK;
        float len = wid * 1.6 + min(aOrb.w * d * uZoom * uDpr * uStreak * dl, 14.0 * uDpr);
        vSize = len + 2.0;
        gl_PointSize = vSize;
        gl_Position = vec4(pos.x / uView.x * 2.0 - 1.0, 1.0 - pos.y / uView.y * 2.0, 0.0, 1.0);
        float tw = aLook.z >= 0.0 ? 0.55 + 0.45 * sin(uTime * 2.0 + aLook.z) : 1.0;
        vCol = aCol * aLook.y * tw; vDir = dir; vLen = len; vWid = wid;
      }`, PART_FS);
    const QV = `attribute vec2 aPos; varying vec2 vUv; void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
    const bright = link(QV, `
      precision mediump float; varying vec2 vUv; uniform sampler2D uSrc; uniform vec2 uTexel; uniform float uThr;
      void main() {
        vec4 s = (texture2D(uSrc, vUv + uTexel * vec2(-1.0, -1.0)) + texture2D(uSrc, vUv + uTexel * vec2(1.0, -1.0)) +
                  texture2D(uSrc, vUv + uTexel * vec2(-1.0, 1.0)) + texture2D(uSrc, vUv + uTexel * vec2(1.0, 1.0))) * 0.25;
        float l = max(s.r, max(s.g, s.b));
        gl_FragColor = vec4(s.rgb * smoothstep(uThr, uThr + 0.35, l), 1.0);
      }`);
    const blur = link(QV, `
      precision mediump float; varying vec2 vUv; uniform sampler2D uSrc; uniform vec2 uDir;
      void main() {
        vec3 c = texture2D(uSrc, vUv).rgb * 0.227;
        c += (texture2D(uSrc, vUv + uDir * 1.385).rgb + texture2D(uSrc, vUv - uDir * 1.385).rgb) * 0.316;
        c += (texture2D(uSrc, vUv + uDir * 3.231).rgb + texture2D(uSrc, vUv - uDir * 3.231).rgb) * 0.070;
        gl_FragColor = vec4(c, 1.0);
      }`);
    const fin = link(QV, `
      precision mediump float; varying vec2 vUv; uniform sampler2D uScene, uBloom; uniform float uBloomK, uFade;
      void main() {
        vec4 s = texture2D(uScene, vUv);
        vec3 c = s.rgb + texture2D(uBloom, vUv).rgb * uBloomK;
        float a = clamp(max(s.a, max(c.r, max(c.g, c.b))), 0.0, 1.0);
        gl_FragColor = vec4(min(c, vec3(a)), a) * uFade;
      }`);
    const loc = (pr, names) => { const o = {}; names.forEach(n => o[n] = gl.getUniformLocation(pr, n)); return o; };
    return {
      part, partU: loc(part, ['uMr', 'uLt', 'uCenter', 'uView', 'uRpx', 'uDpr', 'uDays', 'uTime', 'uStreak', 'uAlpha', 'uOut']),
      partA: { orb: gl.getAttribLocation(part, 'aOrb'), look: gl.getAttribLocation(part, 'aLook'), col: gl.getAttribLocation(part, 'aCol') },
      belt, beltU: loc(belt, ['uM', 'uF', 'uHalf', 'uView', 'uZoom', 'uDpr', 'uDays', 'uTime', 'uStreak', 'uSizeK']),
      beltA: { orb: gl.getAttribLocation(belt, 'aOrb'), look: gl.getAttribLocation(belt, 'aLook'), col: gl.getAttribLocation(belt, 'aCol') },
      bright, brightU: loc(bright, ['uSrc', 'uTexel', 'uThr']),
      blur, blurU: loc(blur, ['uSrc', 'uDir']),
      fin, finU: loc(fin, ['uScene', 'uBloom', 'uBloomK', 'uFade']),
      targets: null,
    };
  }
  function target(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fb, w, h };
  }
  function ensureTargets() {
    const w = glc.width, h = glc.height;
    if (SC.targets && SC.targets.w === w && SC.targets.h === h) return SC.targets;
    if (SC.targets) for (const k of ['scene', 'a', 'b']) { gl.deleteTexture(SC.targets[k].tex); gl.deleteFramebuffer(SC.targets[k].fb); }
    const qw = Math.max(1, Math.ceil(w / 4)), qh = Math.max(1, Math.ceil(h / 4));
    return (SC.targets = { w, h, scene: target(w, h), a: target(qw, qh), b: target(qw, qh) });
  }
  function quadPass(prog, dst) {
    gl.useProgram(prog);
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst ? dst.fb : null);
    gl.viewport(0, 0, dst ? dst.w : glc.width, dst ? dst.h : glc.height);
    gl.bindBuffer(gl.ARRAY_BUFFER, GLR.buf);
    const a = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(a);
    gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // particle layout per body: rings sampled from the real radial profile, then a loose sparkling debris disc
  function buildGpuParticles(b, ringOuter) {
    const data = [];
    const push = (r, a, h, w, size, br, tw, c) => data.push(r, a, h, w, size, br, tw, 0, c[0] / 255, c[1] / 255, c[2] / 255);
    const kepler = r => TAU / (b.p1 * Math.pow(r, 1.5));
    const k = small ? 1 : 1.8;
    if (b.rings) {
      const ring = ringProfile(b);
      const n = Math.round((b.id === 'saturn' ? 42000 : 2500) * k);
      for (let i = 0; i < n; i++) {
        let r, c;
        for (let tries = 0; tries < 30; tries++) {
          r = rnd(ring.rin, ring.rout);
          if (b.id === 'saturn') { c = ringColor(r); }
          else { c = [0, 0, 0, 0]; for (const [r0, r1, dens, cols] of b.rings) if (r >= r0 && r <= r1) c = [...hexRgb(pick(cols)), Math.min(1, dens * 2)]; }
          if (Math.random() < c[3]) break;
        }
        const j = rnd(0.75, 1.25), flake = Math.random() < 0.03;
        const col = flake ? [255, 252, 245] : [Math.min(255, c[0] * j), Math.min(255, c[1] * j), Math.min(255, c[2] * j)];
        push(r, rnd(0, TAU), gauss() * 0.006, kepler(r), flake ? rnd(1.6, 2.6) : rnd(0.6, 1.4), (flake ? rnd(0.5, 0.8) : rnd(0.1, 0.3)) * (b.id === 'saturn' ? 1 : 0.8), -1, col);
      }
    }
    if (!b.isSun) {

    pts.delete(e.pointerId);
    if (pts.size < 2) pinch0 = null;
    if (tap && !tap.moved && performance.now() - tap.t < 500 && closeTarget === 0) {
      const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      let best = null, bd = Infinity;
      for (const o of showSmall ? [...BODIES, ...SMALL] : BODIES) {
        const d = Math.hypot(x - o.sx, y - o.sy) - o.sr;
        if (d < 18 && d < bd) { bd = d; best = o; }
      }
      if (best) choose(best);
    }
    tap = null;
  });
  cv.addEventListener('pointercancel', e => { pts.delete(e.pointerId); pinch0 = null; tap = null; });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const k = Math.exp(-e.deltaY * 0.0015);
    if (closeTarget === 1) cZoom = clamp(cZoom * k, 0.35, 3.5);
    else zoom = zoomTarget = clamp(zoom * k, zoom0 * 0.6, zoom0 * 14);
  }, { passive: false });

  // high-resolution maps are built in the background, most-visited bodies first
  if (GLR) ['earth', 'saturn', 'jupiter', 'mars', 'sun', 'venus', 'uranus', 'neptune', 'mercury'].forEach(id => {
    const b = BODIES.find(o => o.id === id);
    b.texJob = textureJob(b, small ? 512 : 1024); texQueue.push(b);
  });

  // ---------- frame loop ----------
  let last = performance.now(), t = 0, lastDateStr = '', frameDt = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt; frameDt = dt;
    const dDays = speed * dt;
    days += dDays;
    if (GLR) pumpTextures(closeK > 0 ? 10 : 5);

    // transition between overview and close-up
    closeK = closeTarget ? Math.min(1, closeK + dt / 1.3) : Math.max(0, closeK - dt / 0.9);
    if (closeTarget === 0 && closeK === 0 && pendingSel) { const b = pendingSel; pendingSel = undefined; enter(b); }
    const e = smooth(smooth(closeK));

    if (!pts.size) {
      yaw += vYaw; vYaw *= 0.93;
      cYaw += vcYaw; vcYaw *= 0.93;
      if (!reduce && closeK === 0) yaw += dt * 0.02;   // slow drift around the system
    }
    const [tx, , tz] = focus ? planetPos(focus) : [0, 0, 0];
    const ease = Math.min(1, dt * 4);
    fx += (tx - fx) * ease; fz += (tz - fz) * ease;
    zoom += (zoomTarget - zoom) * ease;

    if (GLR && (glc.width !== cv.width || glc.height !== cv.height)) { glc.width = cv.width; glc.height = cv.height; }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(bgCanvas, 0, 0, W, H);
    const drawStars = a => {
      for (const s of stars) {
        ctx.fillStyle = `rgba(215,225,255,${((0.3 + 0.5 * Math.abs(Math.sin(t * s.sp + s.tw))) * a).toFixed(3)})`;
        ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
      }
    };
    if (closeK < 1) { drawStars(1); drawOverview(closeK > 0 ? 0 : dDays); }
    if (closeK > 0 && sel) {
      ctx.globalAlpha = e; ctx.drawImage(sel.isSun ? bgSun : bgClose, 0, 0, W, H); ctx.globalAlpha = 1;
      drawStars(e);
      closeR = Math.min(Math.min(W, H) * 0.5 / sel.close.fit, Math.min(W, H) * (sel.isSun ? 0.3 : 0.34));
      // the close-up grows out of the body's spot in the overview
      const s0 = clamp((sel.sr || 4) / closeR, 0.01, 1);
      const sc = lerp(s0, 1, e);
      closeSc = sc;
      const cxp = lerp(sel.sx, W / 2, e), cyp = lerp(sel.sy, H * 0.52, e);
      closeCx = cxp; closeCy = cyp;
      ctx.setTransform(DPR * sc, 0, 0, DPR * sc, DPR * cxp, DPR * cyp);
      drawClose(sel, e, dDays, t);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      if (sel.id === 'earth' && showNames && e > 0.9) {
        // James Webb Space Telescope at Sun–Earth L2, 1.5 million km straight away from the Sun
        const [x, , z] = planetPos(sel), l = Math.hypot(x, z);
        const Mc = closeCam(), k = 4.6 * closeR * cZoom * sc;
        const wx = x / l, wz = z / l;
        edgeMarker(cxp + (Mc[0] * wx + Mc[2] * wz) * k, cyp + (Mc[3] * wx + Mc[5] * wz) * k, 'УЭББ · L2, 1,5 МЛН КМ', '#ffd27a', e);
      }
    }

    const ds = (closeTarget ? fmtTime : fmtDay).format(new Date(J2000 + days * 86400000));
    if (ds !== lastDateStr) { dateEl.textContent = ds; lastDateStr = ds; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
