<title>Звёздное кольцо</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one full-bleed canvas, the planet tilted across the frame like in the reference */
  :root {
    --space: #02030a;
    --hint: rgba(170, 200, 255, 0.45);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--space);
    overflow: hidden;
    touch-action: none;
    padding-left: max(0px, env(safe-area-inset-left, 0px));
    padding-right: max(0px, env(safe-area-inset-right, 0px));
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.12em;
    color: var(--hint);
    pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
</style>

<canvas id="sky"></canvas>
<div class="hint">ПРОВЕДИ ПАЛЬЦЕМ, ЧТОБЫ ПОВЕРНУТЬ</div>

<script>
(() => {
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR, cx, cy, S;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W * 0.5; cy = H * 0.5;
    S = Math.min(W, H) * 0.5;          // base scale
  }
  addEventListener('resize', resize);
  resize();

  const rnd = (a, b) => a + Math.random() * (b - a);
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

  // Ring bands: [inner, outer, density, palette]
  const BLUE = ['#ffffff', '#cfe4ff', '#7fb6ff', '#3d7dff', '#1f4fd8', '#9fd8ff'];
  const bands = [
    [0.50, 0.56, 1.0, BLUE],
    [0.58, 0.70, 1.6, BLUE],
    [0.73, 0.76, 0.6, ['#ffffff', '#e6f0ff']],
    [0.79, 0.98, 2.2, BLUE],
    [1.01, 1.05, 0.5, ['#bcd6ff', '#ffffff']],
    [1.08, 1.32, 1.6, BLUE],
    [1.36, 1.75, 0.9, ['#5c8dff', '#9cc4ff', '#ffffff', '#2c5bd6']],
  ];
  const isMobile = Math.min(W, H) < 600;
  const BASE = isMobile ? 7000 : 11000;
  const ring = [];
  for (const [r0, r1, d, pal] of bands) {
    const n = Math.round(BASE * d * (r1 - r0) * 2.2);
    for (let i = 0; i < n; i++) {
      const r = rnd(r0, r1);
      ring.push({
        r, a: Math.random() * Math.PI * 2,
        y: gauss() * 0.012 * (1 + r),
        w: 0.25 / Math.pow(r, 1.5),          // Keplerian-ish speed
        s: Math.random() < 0.06 ? rnd(1.4, 2.4) : rnd(0.5, 1.3),
        c: pal[(Math.random() * pal.length) | 0],
        o: rnd(0.35, 1),
      });
    }
  }
  // Loose debris flung outward along the ring plane (the sparkly cloud in the video)
  const debrisPal = ['#ffffff', '#ffe9a8', '#ffd36b', '#9fd8ff', '#7fb6ff', '#c9a8ff'];
  for (let i = 0; i < (isMobile ? 1400 : 2400); i++) {
    const r = 1.75 + Math.pow(Math.random(), 1.8) * 1.6;
    ring.push({
      r, a: Math.random() * Math.PI * 2,
      y: gauss() * 0.08 * r,
      w: 0.25 / Math.pow(r, 1.5),
      s: Math.random() < 0.1 ? rnd(1.6, 3) : rnd(0.6, 1.6),
      c: debrisPal[(Math.random() * debrisPal.length) | 0],
      o: rnd(0.3, 1),
      tw: rnd(0, 6.28),
    });
  }
  // Distant background stars
  const stars = Array.from({ length: isMobile ? 260 : 500 }, () => ({
    x: Math.random(), y: Math.random(),
    s: Math.random() < 0.08 ? rnd(1, 1.8) : rnd(0.3, 0.9),
    tw: rnd(0, 6.28), sp: rnd(0.5, 2),
  }));
  // Small moons
  const moons = [
    { r: 2.05, a: 0.9, w: 0.09, size: 0.045 },
    { r: 2.6, a: 3.6, w: 0.06, size: 0.025 },
  ];

  // View: tilt of the ring plane and its angle on screen
  let tilt = 0.34, roll = -0.85;
  let vTilt = 0, vRoll = 0, drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    vRoll = (e.clientX - drag.x) * 0.004;
    vTilt = (e.clientY - drag.y) * 0.004;
    roll += vRoll; tilt = Math.max(0.08, Math.min(1.4, tilt + vTilt));
    drag = { x: e.clientX, y: e.clientY };
  });
  const end = () => { drag = null; };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);

  const R = 0.36; // planet radius in units of S

  function project(r, a, y) {
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const ct = Math.cos(tilt), st = Math.sin(tilt);
    const y2 = y * ct + z * st;
    const z2 = z * ct - y * st;            // depth (+ toward viewer)
    const cr = Math.cos(roll), sr = Math.sin(roll);
    return [cx + (x * cr - y2 * sr) * S, cy + (x * sr + y2 * cr) * S, z2];
  }

  function drawPlanet(t) {
    const pr = R * S;
    // halo
    const halo = ctx.createRadialGradient(cx, cy, pr * 0.9, cx, cy, pr * 2.1);
    halo.addColorStop(0, 'rgba(60,130,255,0.35)');
    halo.addColorStop(1, 'rgba(20,40,120,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cx, cy, pr * 2.1, 0, 6.283); ctx.fill();

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, pr, 0, 6.283); ctx.clip();
    const lx = cx - Math.cos(roll + 0.6) * pr * 0.45, ly = cy - Math.sin(roll + 0.6) * pr * 0.45;
    const body = ctx.createRadialGradient(lx, ly, pr * 0.05, cx, cy, pr * 1.05);
    body.addColorStop(0, '#bfe6ff');
    body.addColorStop(0.25, '#3fa2ff');
    body.addColorStop(0.6, '#1546c9');
    body.addColorStop(1, '#030a3a');
    ctx.fillStyle = body;
    ctx.fillRect(cx - pr, cy - pr, pr * 2, pr * 2);
    // atmospheric bands, parallel to the ring plane
    ctx.translate(cx, cy); ctx.rotate(roll);
    ctx.globalCompositeOperation = 'soft-light';
    for (let i = -7; i <= 7; i++) {
      const yy = (i / 7) * pr * Math.cos(tilt) + Math.sin(t * 0.3 + i) * 1.5;
      ctx.fillStyle = i % 2 ? 'rgba(10,30,120,0.35)' : 'rgba(170,225,255,0.25)';
      ctx.fillRect(-pr, yy, pr * 2, pr * 0.07 * (1 + (i * 37 % 5) / 5));
    }
    ctx.restore();
    // rim light
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(120,200,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, pr - 0.75, 0, 6.283); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawMoon(m) {
    const [x, y] = project(m.r, m.a, 0);
    const mr = m.size * S;
    const g = ctx.createRadialGradient(x - mr * 0.4, y - mr * 0.4, mr * 0.1, x, y, mr);
    g.addColorStop(0, '#d6ecff'); g.addColorStop(0.4, '#3d86ff'); g.addColorStop(1, '#061447');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, mr, 0, 6.283); ctx.fill();
  }

  const back = [], front = [];
  let last = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!reduce) t += dt;
    if (!drag) { vRoll *= 0.94; vTilt *= 0.94; roll += vRoll; tilt = Math.max(0.08, Math.min(1.4, tilt + vTilt)); }

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#02030a';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      const a = 0.35 + 0.65 * Math.abs(Math.sin(t * s.sp + s.tw));
      ctx.fillStyle = `rgba(210,225,255,${a * 0.8})`;
      ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
    }

    back.length = 0; front.length = 0;
    const spin = reduce ? 0 : dt;
    for (const p of ring) {
      p.a += p.w * spin;
      const q = project(p.r, p.a, p.y);
      (q[2] < 0 ? back : front).push(p, q);
    }
    const draw = list => {
      for (let i = 0; i < list.length; i += 2) {
        const p = list[i], q = list[i + 1];
        let o = p.o;
        if (p.tw !== undefined) o *= 0.5 + 0.5 * Math.sin(t * 2 + p.tw);
        ctx.globalAlpha = o;
        ctx.fillStyle = p.c;
        ctx.fillRect(q[0], q[1], p.s, p.s);
      }
      ctx.globalAlpha = 1;
    };

    for (const m of moons) { m.a += m.w * spin; if (project(m.r, m.a, 0)[2] < 0) drawMoon(m); }
    draw(back);
    ctx.globalCompositeOperation = 'source-over';
    drawPlanet(t);
    ctx.globalCompositeOperation = 'lighter';
    draw(front);
    ctx.globalCompositeOperation = 'source-over';
    for (const m of moons) if (project(m.r, m.a, 0)[2] >= 0) drawMoon(m);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
